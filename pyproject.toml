[tool.ruff]
line-length = 120
exclude = ["migrations"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = ["migrations"]
plugins = ["sqlalchemy.ext.mypy.plugin"]